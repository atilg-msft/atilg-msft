[project]
name = "polybot"
version = "0.1.0"
description = "Autonomous momentum trading bot for Polymarket (paper-trading by default)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
live = [
    "py-clob-client>=0.20",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
polybot = "polybot.bot:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polybot*"]
