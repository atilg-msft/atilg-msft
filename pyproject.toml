[project]
name = "polybot"
version = "0.1.0"
description = "Autonomous momentum trading bot for Polymarket (paper-trading by default)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
live = [
    "py-clob-client>=0.20",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
azure = [
    "azure-identity>=1.16",
    "azure-keyvault-secrets>=4.8",
    "azure-appconfiguration>=1.5",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
polybot = "polybot.bot:main"
polybot-server = "polybot.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polybot*"]

[tool.setuptools.package-data]
polybot = ["webapp/static/*.html"]
